<style>
/* Layout: one column; intake as a ladder of tiers, then one panel per live event. */
:root {
  --bg: #f5f6f7;
  --surface: #ffffff;
  --ink: #15202b;
  --ink-2: #4a5663;
  --ink-3: #6f7a86;
  --rule: #dde1e6;
  --accent: #1d4f7a;
  --accent-soft: #e5edf5;
  --st-patched: #0ca30c;
  --st-exposed: #d03b3b;
  --st-eol: #ec835a;
  --st-ambiguous: #fab219;
  --st-hidden: #b9c0c8;
  --st-withheld: #8a939d;
  --font-display: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --surface: #1a2027; --ink: #eef1f4; --ink-2: #b8c1ca; --ink-3: #8c97a3;
    --rule: #2d3640; --accent: #8cb8e0; --accent-soft: #1f2d3a;
    --st-hidden: #4f5964; --st-withheld: #77828e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1a2027; --ink: #eef1f4; --ink-2: #b8c1ca; --ink-3: #8c97a3;
  --rule: #2d3640; --accent: #8cb8e0; --accent-soft: #1f2d3a;
  --st-hidden: #4f5964; --st-withheld: #77828e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: flex; flex-direction: column; gap: 40px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-data); font-size: 12.5px; }
.eyebrow {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3);
}
.muted { color: var(--ink-2); }
.fine { color: var(--ink-3); font-size: 13px; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible, .seg:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* header */
header { display: flex; flex-direction: column; gap: 10px; }
header .lede { max-width: 68ch; color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.banner {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 6px;
  padding: 10px 14px; font-size: 13.5px; color: var(--ink-2); max-width: 80ch;
}
.banner strong { color: var(--ink); }
.banner.warn { border-color: var(--st-exposed); }

/* intake ladder */
section { display: flex; flex-direction: column; gap: 16px; }
.section-head { display: flex; flex-direction: column; gap: 4px; }
.section-head p { max-width: 70ch; }
.ladder { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.tier {
  display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px;
  padding-block: 14px; border-bottom: 1px solid var(--rule);
}
.tier-head { display: flex; flex-direction: column; gap: 3px; }
.tier-name { display: flex; align-items: baseline; gap: 8px; font-weight: 600; }
.tier-count {
  font-family: var(--font-data); font-size: 12px; font-weight: 500;
  background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 8px;
}
.tier-blurb { font-size: 13px; color: var(--ink-3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.empty { color: var(--ink-3); font-size: 13.5px; align-self: center; }
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.card.is-live { border-color: var(--accent); }
.card .ids { color: var(--ink-2); overflow-wrap: anywhere; }
.card dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.card dt { color: var(--ink-3); }
.card dd { margin: 0; color: var(--ink-2); }
.card .why { font-size: 13px; color: var(--ink-2); }
.card a.jump { font-size: 13px; font-weight: 600; text-decoration: none; }
.card a.jump:hover { text-decoration: underline; }

/* live panels */
.panel {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  padding: 20px; display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 16px;
}
.panel-head { display: flex; flex-direction: column; gap: 4px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { border-top: 2px solid var(--rule); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.tile.key { border-top-color: var(--st-patched); }
.tile .v { font-family: var(--font-display); font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .l { font-size: 13px; color: var(--ink-2); }
.funnel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; font-size: 13px; color: var(--ink-2); }
.funnel b { font-family: var(--font-data); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.funnel .arrow { color: var(--ink-3); padding-inline: 4px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }

.region { display: flex; flex-direction: column; gap: 8px; }
.region-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 150px; gap: 12px; align-items: center; }
.bar-label { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar-label b { color: var(--ink); font-weight: 600; }
.bar-label .due { display: block; font-size: 11.5px; color: var(--accent); font-weight: 600; }
.bar { display: flex; gap: 2px; height: 22px; }
.seg { height: 100%; min-width: 3px; cursor: default; }
.seg:first-child { border-radius: 4px 0 0 4px; }
.seg:last-child { border-radius: 0 4px 4px 0; }
.seg:only-child { border-radius: 4px; }
.bar-end { font-size: 13px; color: var(--ink-2); }
.bar-end b { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
.axis { display: grid; grid-template-columns: 112px minmax(0, 1fr) 150px; gap: 12px; }
.axis-ticks { position: relative; height: 16px; font-size: 11px; color: var(--ink-3); font-family: var(--font-data); }
.axis-ticks span { position: absolute; transform: translateX(-50%); }
.axis-ticks span:first-child { transform: none; }
.axis-ticks span:last-child { transform: translateX(-100%); }

.hatch {
  background-image: repeating-linear-gradient(45deg, var(--st-withheld) 0 2px, transparent 2px 5px);
  background-color: var(--st-hidden);
}
.caveat { font-size: 13px; color: var(--ink-2); max-width: 78ch; border-left: 2px solid var(--rule); padding-left: 12px; }

details.table-view summary { cursor: pointer; font-size: 13.5px; color: var(--accent); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 640px; width: 100%; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }

#tip {
  position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg);
  font-size: 12.5px; padding: 6px 9px; border-radius: 5px; max-width: 260px; line-height: 1.4;
}
footer { font-size: 13px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; max-width: 80ch; }

@media (max-width: 760px) {
  h1 { font-size: 25px; }
  .tier { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bar-row, .axis { grid-template-columns: 74px minmax(0, 1fr); }
  .bar-end { grid-column: 2; margin-top: -2px; }
  .axis > :last-child { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .seg { transition: filter 120ms; }
}
.seg:hover, .seg:focus-visible { filter: brightness(1.12); }
</style>

      el("div", { class: "eyebrow", text: "Live · disclosed " + fmtDate(e.t0_utc) }),
      el("h2", { id: e.key + "-h", text: e.title }),
      e.kev ? el("p", { class: "muted", text: "On CISA's Known Exploited Vulnerabilities list since " + fmtDate(e.kev.added) + ". Federal civilian agencies must patch by " + fmtDate(e.kev.federal_due) + "; state and local governments are not bound by that date, so bars on or after it show how they compare." + (e.kev.verified ? "" : " Dates not yet verified against CISA's list.") }) : null,
      el("div", { class: "mono muted", text: e.cve_ids.join(" · ") })
    ]));

    var primary = e.regions[0], last = primary && primary.points[primary.points.length - 1];
    if (!last) {
      panel.appendChild(el("p", { class: "muted", text: "No live snapshots yet." }));
      app.appendChild(panel);
      return;
    }
    var tiles = el("div", { class: "tiles" }, [
      tile(last.patched_share === "\u00a7" ? "Withheld" : last.patched_share, "patched, of " + REGION[primary.region] + " sites showing a version", true),
      tile(last.exposed, "exposed or on an end-of-life branch"),
      tile(last.cells.OPAQUE, "run PHP but hide the version"),
      tile("Day " + last.day.toFixed(1), "since disclosure, snapshot of " + fmtDate(last.started))
    ]);
    panel.appendChild(tiles);
    panel.appendChild(el("div", { class: "funnel", "aria-label": "Coverage at the latest " + REGION[primary.region] + " snapshot" }, [
      el("b", { text: last.funnel.domains }), " domains", el("span", { class: "arrow", text: "→" }),
      el("b", { text: last.funnel.reached }), " answered", el("span", { class: "arrow", text: "→" }),
      el("b", { text: last.funnel.php }), " show PHP", el("span", { class: "arrow", text: "→" }),
      el("b", { text: last.funnel.visible }), " show a version we can rank"
    ]));

    var legend = el("div", { class: "legend", role: "list" });
    ORDER.forEach(function (s) {
      legend.appendChild(el("span", { role: "listitem", title: STATE[s].note }, [swatch(s), STATE[s].icon + " " + STATE[s].label]));
    });
    if (D.suppressed) {
      var hs = el("i", { class: "sw hatch", "aria-hidden": "true" });
      legend.appendChild(el("span", { role: "listitem" }, [hs, "Withheld (cells under 10, pooled)"]));
    }
    panel.appendChild(legend);

    e.regions.forEach(function (rg) {
      var box = el("div", { class: "region" });
      box.appendChild(el("div", { class: "region-name" }, [
        el("h3", { text: REGION[rg.region] || rg.region }),
        el("span", { class: "fine", text: "share of domains with PHP evidence, one bar per snapshot" })
      ]));
      var bars = el("div", { class: "bars" });
      rg.points.forEach(function (p) {
        var bar = el("div", { class: "bar", role: "img", "aria-label": barLabel(p) });
        if (p.P_n) {
          ORDER.forEach(function (s) {
            var n = p.shown[s];
            if (!n) return;
            var seg = el("span", { class: "seg", tabindex: "0" });
            seg.style.flex = n + " 0 0";
            seg.style.background = "var(" + STATE[s].cls + ")";
            var txt = STATE[s].icon + " " + STATE[s].label + ": " + n + " of " + p.P_n + " (" + Math.round(100 * n / p.P_n) + "%). " + STATE[s].note + ".";
            hook(seg, txt);
            bar.appendChild(seg);
          });
          if (p.withheld > 0) {
            var w = el("span", { class: "seg hatch", tabindex: "0" });
            w.style.flex = p.withheld + " 0 0";
            var hidden = ORDER.filter(function (s) { return !(s in p.shown) && p.cells[s] !== "0"; })
              .map(function (s) { return STATE[s].label; });
            hook(w, "Withheld: " + p.withheld + " domains across " + hidden.join(", ") + ", each under 10 or held back so the others cannot be worked out.");
            bar.appendChild(w);
          }
        } else {
          var none = el("span", { class: "seg hatch", tabindex: "0" });
          none.style.flex = "1 0 0";
          hook(none, "Fewer than 10 domains with PHP evidence; withheld.");
          bar.appendChild(none);
        }
        bars.appendChild(el("div", { class: "bar-row" }, [
          el("div", { class: "bar-label", html: "<b>Day " + p.day.toFixed(1) + "</b> · " + fmtDate(p.started) + (p.after_federal_due ? "<span class=\"due\">past federal deadline</span>" : "") }),
          bar,
          el("div", { class: "bar-end", html: p.patched_share === "\u00a7" ? "Patched share withheld" : p.patched_share === "\u2013" ? "No ranked versions" : "<b>" + p.patched_share + "</b> patched of visible" })
        ]));
      });
      bars.appendChild(el("div", { class: "axis", "aria-hidden": "true" }, [
        el("span"),
        el("div", { class: "axis-ticks" }, [el("span", { style: "left:0", text: "0%" }), el("span", { style: "left:50%", text: "50%" }), el("span", { style: "left:100%", text: "100%" })]),
        el("span")
      ]));
      box.appendChild(bars);
      panel.appendChild(box);
    });

    panel.appendChild(el("p", { class: "caveat", text: "A hidden version does not mean a site is patched, and a distro build can carry the fix without changing its version string. Those sites stay in their own segments and are left out of the patched share. These are domain counts from each run report; the pre-registered entity-level analysis is in reports/analysis_*.md." }));
    panel.appendChild(tableView(e));
    app.appendChild(panel);
  });

  function tile(v, label, key) {
    return el("div", { class: "tile" + (key ? " key" : "") }, [el("div", { class: "v", text: v }), el("div", { class: "l", text: label })]);
  }
  function barLabel(p) {
    if (!p.P_n) return "Day " + p.day.toFixed(1) + ": withheld, fewer than 10 domains with PHP evidence.";
    return "Day " + p.day.toFixed(1) + ", " + p.P + " domains with PHP evidence: " +
      ORDER.map(function (s) { return STATE[s].label + " " + p.cells[s]; }).join(", ") + ". Patched share of visible versions " + p.patched_share + ".";
  }
  function hook(node, text) {
    node.addEventListener("mouseenter", function (ev) { showTip(ev, text); });
    node.addEventListener("mousemove", function (ev) { showTip(ev, text); });
    node.addEventListener("mouseleave", hideTip);
    node.addEventListener("focus", function (ev) { showTip(ev, text); });
    node.addEventListener("blur", hideTip);
  }
  function tableView(e) {
    var head = ["Region", "Snapshot", "Day", "Domains", "Answered", "PHP"].concat(ORDER.map(function (s) { return STATE[s].label; }), ["Patched of visible"]);
    var rows = [];
    e.regions.forEach(function (rg) {
      rg.points.forEach(function (p) {
        rows.push([REGION[rg.region] || rg.region, p.label, p.day.toFixed(1), p.funnel.domains, p.funnel.reached, p.P]
          .concat(ORDER.map(function (s) { return p.cells[s]; }), [p.patched_share]));
      });
    });
    var table = el("table", null, [
      el("thead", null, [el("tr", null, head.map(function (h) { return el("th", { scope: "col", text: h }); }))]),
      el("tbody", null, rows.map(function (r) { return el("tr", null, r.map(function (c) { return el("td", { text: String(c) }); })); }))
    ]);
    return el("details", { class: "table-view" }, [el("summary", { text: "Show the numbers as a table" }), el("div", { class: "tbl-wrap" }, [table])]);
  }

  app.appendChild(el("footer", null, [
    el("p", { text: "Passive only: one homepage GET per domain per snapshot, with a declared user agent and published rate limits. Tribal nations' sites are not measured. Per-domain results go only to the principal investigator." }),
    el("p", { text: "Opt out by emailing jforden@carrollu.edu with your domain. It is removed within 24 hours." })
  ]));
})();
</script>
