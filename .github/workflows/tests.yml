# Run the test suite on every pull request and on pushes to main.
#
# The suite is loopback and synthetic only: tests/mock_server.py serves the fake web on 127.0.0.1,
# and no test needs the network, a database from data/, or Gate A (LIVE_REQUESTS_ENABLED is False in
# every checkout of main, which one test asserts). The workflow needs no secrets and requests no
# permissions beyond reading the repository. It does not run any scan, any collector task or any
# script that talks to a government site.
#
# Written on a branch and not yet pushed: it takes effect when Jack merges and pushes it.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Run the suite
        run: python -X utf8 -m pytest -q
